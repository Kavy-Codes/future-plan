<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F4EE" />

      name="description"
      content="A calm, checked plan for a Class 12 Humanities student in Delhi who wants a career in psychology: the degree, the entrance exams, the licence, the money, and the honest alternatives."
    />
    <meta property="og:title" content="Future Plan · A psychology career, mapped" />
    <meta
      property="og:description"
      content="One recommended route from Class 12 to a career in psychology, with the honest catch on every alternative."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="application-name" content="Future Plan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Future Plan" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('futureplan.v1.theme');
          try {
            saved = saved === null ? null : JSON.parse(saved);
          } catch (e) {
            saved = null;
          }
          var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = saved === 'dark' || saved === 'light' ? saved : system;
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#101613' : '#F7F4EE');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
